<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pure Canvas 2D Farm</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: sans-serif; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background: #1b5e20; color: #fff; }

        .top-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 50px;
            background: rgba(0, 0, 0, 0.8); border-bottom: 3px solid #fbc02d;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px; z-index: 100;
        }
        .coins { font-size: 20px; font-weight: bold; color: #fbc02d; }
        .title { font-size: 16px; font-weight: bold; color: #8bc34a; }

        #gameCanvas {
            width: 100vw; height: 100vh; display: block; background: #388e3c;
        }

        .controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0, 0, 0, 0.85); border-top: 3px solid #fbc02d;
            padding: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 100;
        }
        .row { display: flex; gap: 8px; }
        .btn {
            flex: 1; padding: 12px 5px; font-size: 13px; font-weight: bold; border-radius: 8px; border: none;
            background: #ffa000; color: #000; cursor: pointer;
        }
        .btn-buy { background: #4caf50; color: #fff; }
        .btn-switch { background: #0288d1; color: #fff; }

        #toast {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            background: #000; border: 2px solid #fbc02d; color: #fff; padding: 8px 16px;
            border-radius: 20px; font-size: 13px; font-weight: bold; opacity: 0;
            transition: opacity 0.3s; z-index: 200; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="toast">गेम शुरू हो गया है!</div>

    <div class="top-bar">
        <div class="coins">💰 ₹<span id="coin-txt">150</span></div>
        <div class="title" id="mode-txt">Poultry Farm</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <div class="row">
            <button class="btn" onclick="feedCurrent()">🌾 दाना/चारा दें</button>
            <button class="btn" onclick="waterCurrent()">💧 पानी दें</button>
            <button class="btn btn-buy" onclick="buyCurrent()" id="buy-btn">➕ Buy Hen (₹100)</button>
        </div>
        <div class="row">
            <button class="btn btn-switch" onclick="toggleMode()">🔄 स्विच करें (Cow / Hen Farm)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let coins = 150;
        let mode = 'hen'; // 'hen' or 'cow'

        let hens = [{ x: 100, y: 200, need: 'food', ready: false }];
        let cows = [{ x: 100, y: 220, need: 'food', ready: false }];

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg; t.style.opacity = "1";
            setTimeout(() => { t.style.opacity = "0"; }, 2000);
        }

        function updateUI() {
            document.getElementById("coin-txt").textContent = coins;
            if(mode === 'hen') {
                document.getElementById("mode-txt").textContent = "Poultry Yard (मुर्गी फार्म)";
                document.getElementById("buy-btn").textContent = "➕ Buy Hen (₹100)";
            } else {
                document.getElementById("mode-txt").textContent = "Cattle Shed (गाय फार्म)";
                document.getElementById("buy-btn").textContent = "➕ Buy Cow (₹200)";
            }
        }

        function toggleMode() {
            mode = (mode === 'hen') ? 'cow' : 'hen';
            updateUI();
        }

        // --- CANVAS DRAWING (Zero External Links) ---
        function drawBackground() {
            // Grass
            ctx.fillStyle = mode === 'hen' ? "#4caf50" : "#388e3c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Red Barn House
            ctx.fillStyle = "#b71c1c";
            ctx.fillRect(canvas.width - 150, 70, 120, 100);
            ctx.fillStyle = "#d32f2f";
            ctx.beginPath();
            ctx.moveTo(canvas.width - 160, 70);
            ctx.lineTo(canvas.width - 90, 20);
            ctx.lineTo(canvas.width - 20, 70);
            ctx.fill();

            // Door
            ctx.fillStyle = "#5d4037";
            ctx.fillRect(canvas.width - 110, 110, 40, 60);
        }

        function drawHen(h) {
            ctx.save();
            ctx.translate(h.x, h.y);

            // Hen Body
            ctx.fillStyle = "#ffb74d";
            ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
            // Head
            ctx.fillStyle = "#ffa726";
            ctx.beginPath(); ctx.arc(12, -12, 12, 0, Math.PI * 2); ctx.fill();
            // Comb
            ctx.fillStyle = "#e53935";
            ctx.beginPath(); ctx.arc(12, -24, 5, 0, Math.PI * 2); ctx.fill();
            // Beak
            ctx.fillStyle = "#f57c00";
            ctx.beginPath(); ctx.moveTo(22, -12); ctx.lineTo(30, -8); ctx.lineTo(22, -4); ctx.fill();

            // Bubble
            drawBubble(h);
            ctx.restore();
        }

        function drawCow(c) {
            ctx.save();
            ctx.translate(c.x, c.y);

            // Body
            ctx.fillStyle = "#ffffff";
            ctx.beginPath(); ctx.ellipse(0, 0, 40, 28, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.stroke();

            // Spots
            ctx.fillStyle = "#000000";
            ctx.beginPath(); ctx.arc(-10, -5, 10, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(15, 8, 8, 0, Math.PI * 2); ctx.fill();

            // Head
            ctx.fillStyle = "#ffffff";
            ctx.beginPath(); ctx.arc(35, -15, 18, 0, Math.PI * 2); ctx.fill();
            ctx.stroke();

            // Snout
            ctx.fillStyle = "#ffab91";
            ctx.beginPath(); ctx.arc(42, -10, 10, 0, Math.PI * 2); ctx.fill();

            // Bubble
            drawBubble(c);
            ctx.restore();
        }

        function drawBubble(item) {
            let txt = "";
            if(item.ready) txt = mode === 'hen' ? "🥚 Egg Ready!" : "🥛 Milk Ready!";
            else if(item.need === 'food') txt = mode === 'hen' ? "🌾 दाना दो!" : "🌿 चारा दो!";
            else if(item.need === 'water') txt = "💧 पानी दो!";

            if(txt) {
                ctx.fillStyle = item.ready ? "#fff59d" : "#ffffff";
                ctx.fillRect(-30, -55, 80, 24);
                ctx.strokeStyle = "#000"; ctx.lineWidth = 1; ctx.strokeRect(-30, -55, 80, 24);
                ctx.fillStyle = "#000"; ctx.font = "bold 11px sans-serif";
                ctx.fillText(txt, -25, -38);
            }
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            if(mode === 'hen') hens.forEach(drawHen);
            else cows.forEach(drawCow);

            requestAnimationFrame(loop);
        }
        loop();

        // --- CONTROLS ---
        function feedCurrent() {
            let list = mode === 'hen' ? hens : cows;
            let cost = mode === 'hen' ? 5 : 10;
            let fed = false;

            list.forEach(item => {
                if(item.need === 'food' && coins >= cost) {
                    coins -= cost; item.need = 'water'; fed = true;
                }
            });
            if(fed) { updateUI(); showToast("खाना खिलाया! अब पानी दें।"); }
        }

        function waterCurrent() {
            let list = mode === 'hen' ? hens : cows;
            let cost = mode === 'hen' ? 2 : 5;
            let watered = false;

            list.forEach(item => {
                if(item.need === 'water' && coins >= cost) {
                    coins -= cost; item.need = 'none'; watered = true;
                    setTimeout(() => { item.ready = true; }, 8000);
                }
            });
            if(watered) { updateUI(); showToast("पानी पिलाया! माल तैयार हो रहा है..."); }
        }

        function buyCurrent() {
            if(mode === 'hen' && coins >= 100) {
                coins -= 100;
                hens.push({ x: Math.random()*(canvas.width-120)+40, y: Math.random()*(canvas.height-300)+150, need: 'food', ready: false });
                showToast("नई मुर्गी ख़रीदी!");
            } else if(mode === 'cow' && coins >= 200) {
                coins -= 200;
                cows.push({ x: Math.random()*(canvas.width-140)+40, y: Math.random()*(canvas.height-300)+150, need: 'food', ready: false });
                showToast("नई गाय ख़रीदी!");
            } else showToast("पैसे कम हैं!");
            updateUI();
        }

        // Click to Collect
        canvas.addEventListener("click", (e) => {
            let list = mode === 'hen' ? hens : cows;
            list.forEach(item => {
                if(item.ready && Math.hypot(e.clientX - item.x, e.clientY - item.y) < 40) {
                    coins += mode === 'hen' ? 40 : 90;
                    item.ready = false; item.need = 'food';
                    showToast(mode === 'hen' ? "🥚 अंडा इकट्ठा किया! +₹40" : "🥛 दूध इकट्ठा किया! +₹90");
                    updateUI();
                }
            });
        });

        // Auto Random Movement
        setInterval(() => {
            hens.forEach(h => { h.x += Math.random()*20 - 10; h.y += Math.random()*20 - 10; });
            cows.forEach(c => { c.x += Math.random()*20 - 10; c.y += Math.random()*20 - 10; });
        }, 2000);

        updateUI();
    </script>
</body>
</html>
