<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cartoon Farm Tycoon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Comic Sans MS', 'Segoe UI', sans-serif; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background: #2e7d32; color: #fff; }

        .app-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: relative; }

        /* Top HUD */
        .top-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 50px;
            background: rgba(0, 0, 0, 0.6); border-bottom: 3px solid #ffca28;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px; z-index: 100;
        }
        .coins { font-size: 20px; font-weight: bold; color: #ffca28; text-shadow: 1px 1px 2px #000; }
        .zone-title { font-size: 16px; font-weight: bold; color: #aed581; }

        /* Main Menu Screen */
        .menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)),
                        url('https://img.freepik.com/free-vector/farm-scene-with-red-barn-field_1308-55271.jpg') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; z-index: 200;
        }
        .menu-title { font-size: 30px; font-weight: bold; color: #ffca28; text-shadow: 2px 2px 4px #000; text-align: center; }
        .menu-btn {
            width: 80%; max-width: 300px; padding: 15px; font-size: 18px; font-weight: bold;
            background: #7cb342; color: white; border: 3px solid #fff;
            border-radius: 15px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .menu-btn:active { transform: scale(0.95); }

        /* Farm Sections */
        .farm-section { width: 100%; height: 100%; display: none; flex-direction: column; position: relative; }
        .active-section { display: flex; }

        /* Cartoon Backgrounds */
        #hen-farm {
            background: url('https://img.freepik.com/free-vector/poultry-farm-concept-illustration_1284-58721.jpg') center/cover no-repeat;
        }
        #cow-farm {
            background: url('https://img.freepik.com/free-vector/farm-landscape-with-cows-grass_1308-58823.jpg') center/cover no-repeat;
        }

        /* Interactive Yard Area */
        .play-area { flex: 1; width: 100%; position: relative; margin-top: 50px; margin-bottom: 110px; }

        /* Animal Wrap & Thought Bubbles */
        .animal-wrap {
            position: absolute; display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: left 2s ease, top 2s ease;
        }
        .cartoon-img { filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.3)); }
        .hen-img { width: 85px; height: 85px; }
        .cow-img { width: 120px; height: 120px; }

        .thought-bubble {
            background: #ffffff; color: #000; padding: 5px 10px; border-radius: 15px;
            font-size: 12px; font-weight: bold; border: 2px solid #333;
            position: absolute; top: -30px; white-space: nowrap; box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            animation: bounce 0.6s infinite alternate; z-index: 10;
        }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }

        /* Bottom Control Panel */
        .bottom-controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0, 0, 0, 0.8); border-top: 3px solid #ffca28;
            padding: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 100;
        }
        .action-row { display: flex; gap: 6px; width: 100%; }
        .act-btn {
            flex: 1; padding: 12px 5px; font-size: 12px; font-weight: bold; border-radius: 10px; border: none;
            background: #ffb300; color: #000; cursor: pointer; box-shadow: 0 3px 0 #c78100;
        }
        .act-btn:active { transform: translateY(2px); box-shadow: none; }
        .btn-buy { background: #7cb342; color: #fff; box-shadow: 0 3px 0 #4b830d; }
        .btn-home { background: #e53935; color: #fff; box-shadow: 0 3px 0 #ab000d; }

        /* Toast Message */
        #game-toast {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); border: 2px solid #ffca28; color: #fff;
            padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold;
            pointer-events: none; opacity: 0; transition: opacity 0.3s ease; z-index: 300; text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="game-toast">फार्म में आपका स्वागत है!</div>

        <!-- Top Status Bar -->
        <div class="top-bar">
            <div class="coins">💰 ₹<span id="coins-val">150</span></div>
            <div class="zone-title" id="zone-title">Main Village</div>
        </div>

        <!-- Main Menu -->
        <div class="menu-screen" id="main-menu">
            <div class="menu-title">🏡 CARTOON FARM</div>
            <button class="menu-btn" onclick="openZone('hen-farm')">🐔 Hen Farm (मुर्गी फार्म)</button>
            <button class="menu-btn" onclick="openZone('cow-farm')">🐄 Cow Farm (गाय फार्म)</button>
        </div>

        <!-- 1. HEN FARM -->
        <div class="farm-section" id="hen-farm">
            <div class="play-area" id="hen-area"></div>
            <div class="bottom-controls">
                <div class="action-row">
                    <button class="act-btn" onclick="feedHens()">🌾 दाना दें (₹5)</button>
                    <button class="act-btn" onclick="waterHens()">💧 पानी दें (₹2)</button>
                    <button class="act-btn btn-buy" onclick="buyHen()">➕ Buy Hen (₹100)</button>
                </div>
                <div class="action-row">
                    <button class="act-btn btn-home" onclick="showMenu()">🏠 मुख्य मेन्यू</button>
                </div>
            </div>
        </div>

        <!-- 2. COW FARM -->
        <div class="farm-section" id="cow-farm">
            <div class="play-area" id="cow-area"></div>
            <div class="bottom-controls">
                <div class="action-row">
                    <button class="act-btn" onclick="feedCows()">🌿 चारा दें (₹10)</button>
                    <button class="act-btn" onclick="waterCows()">💧 पानी दें (₹5)</button>
                    <button class="act-btn btn-buy" onclick="buyCow()">➕ Buy Cow (₹200)</button>
                </div>
                <div class="action-row">
                    <button class="act-btn btn-home" onclick="showMenu()">🏠 मुख्य मेन्यू</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        let coins = 150;

        let hens = [{ id: 1, need: 'food', ready: false }];
        let cows = [{ id: 1, need: 'food', ready: false }];

        // Reliable Vector/Cartoon SVG Data Links (No broken images)
        const HEN_SVG = "https://cdn-icons-png.flaticon.com/512/1864/1864593.png";
        const COW_SVG = "https://cdn-icons-png.flaticon.com/512/2396/2396837.png";

        function showToast(msg) {
            const toast = document.getElementById("game-toast");
            toast.textContent = msg;
            toast.style.opacity = "1";
            setTimeout(() => { toast.style.opacity = "0"; }, 2000);
        }

        function updateCoins() {
            document.getElementById("coins-val").textContent = coins;
        }

        function showMenu() {
            document.getElementById("main-menu").style.display = "flex";
            document.querySelectorAll(".farm-section").forEach(s => s.classList.remove("active-section"));
            document.getElementById("zone-title").textContent = "Main Village";
        }

        function openZone(zoneId) {
            document.getElementById("main-menu").style.display = "none";
            document.querySelectorAll(".farm-section").forEach(s => s.classList.remove("active-section"));
            document.getElementById(zoneId).classList.add("active-section");

            if(zoneId === 'hen-farm') document.getElementById("zone-title").textContent = "Poultry Yard";
            if(zoneId === 'cow-farm') document.getElementById("zone-title").textContent = "Cattle Shed";
        }

        // Hen Controls
        function renderHens() {
            const container = document.getElementById("hen-area");
            container.innerHTML = "";

            hens.forEach((h, index) => {
                const wrap = document.createElement("div");
                wrap.className = "animal-wrap";
                wrap.id = `hen-wrap-${h.id}`;
                wrap.style.top = (80 + (index * 35) % 150) + "px";
                wrap.style.left = (50 + (index * 60) % 200) + "px";

                let bubbleTxt = "";
                let show = true;

                if (h.ready) bubbleTxt = "🥚 Egg Ready!";
                else if (h.need === 'food') bubbleTxt = "🌾 दाना दो!";
                else if (h.need === 'water') bubbleTxt = "💧 पानी दो!";
                else show = false;

                wrap.innerHTML = `
                    ${show ? `<div class="thought-bubble">${bubbleTxt}</div>` : ''}
                    <img src="${HEN_SVG}" class="cartoon-img hen-img" onclick="collectEgg(${h.id})" alt="Cartoon Hen">
                `;
                container.appendChild(wrap);
            });
        }

        function buyHen() {
            if (coins >= 100) {
                coins -= 100;
                hens.push({ id: Date.now(), need: 'food', ready: false });
                updateCoins();
                renderHens();
                showToast("एक नई मुर्गी आ गई!");
            } else showToast("पैसे कम हैं (₹100 चाहिए)!");
        }

        function feedHens() {
            let done = false;
            hens.forEach(h => {
                if (h.need === 'food' && coins >= 5) {
                    coins -= 5;
                    h.need = 'water';
                    done = true;
                }
            });
            if (done) { updateCoins(); renderHens(); showToast("मुर्गी ने दाना खा लिया, अब पानी चाहिए!"); }
        }

        function waterHens() {
            let done = false;
            hens.forEach(h => {
                if (h.need === 'water' && coins >= 2) {
                    coins -= 2;
                    h.need = 'none';
                    done = true;
                    setTimeout(() => { h.ready = true; renderHens(); }, 10000);
                }
            });
            if (done) { updateCoins(); renderHens(); showToast("पानी दे दिया! अंडा तैयार हो रहा है..."); }
        }

        function collectEgg(id) {
            const h = hens.find(x => x.id === id);
            if (h && h.ready) {
                coins += 40;
                h.ready = false;
                h.need = 'food';
                updateCoins();
                renderHens();
                showToast("🥚 अंडा मिल गया! +₹40");
            }
        }

        // Cow Controls
        function renderCows() {
            const container = document.getElementById("cow-area");
            container.innerHTML = "";

            cows.forEach((c, index) => {
                const wrap = document.createElement("div");
                wrap.className = "animal-wrap";
                wrap.id = `cow-wrap-${c.id}`;
                wrap.style.top = (70 + (index * 50) % 140) + "px";
                wrap.style.left = (40 + (index * 70) % 180) + "px";

                let bubbleTxt = "";
                let show = true;

                if (c.ready) bubbleTxt = "🥛 Milk Ready!";
                else if (c.need === 'food') bubbleTxt = "🌿 चारा दो!";
                else if (c.need === 'water') bubbleTxt = "💧 पानी दो!";
                else show = false;

                wrap.innerHTML = `
                    ${show ? `<div class="thought-bubble">${bubbleTxt}</div>` : ''}
                    <img src="${COW_SVG}" class="cartoon-img cow-img" onclick="collectMilk(${c.id})" alt="Cartoon Cow">
                `;
                container.appendChild(wrap);
            });
        }

        function buyCow() {
            if (coins >= 200) {
                coins -= 200;
                cows.push({ id: Date.now(), need: 'food', ready: false });
                updateCoins();
                renderCows();
                showToast("एक नई गाय ख़रीद ली!");
            } else showToast("पैसे कम हैं (₹200 चाहिए)!");
        }

        function feedCows() {
            let done = false;
            cows.forEach(c => {
                if (c.need === 'food' && coins >= 10) {
                    coins -= 10;
                    c.need = 'water';
                    done = true;
                }
            });
            if (done) { updateCoins(); renderCows(); showToast("गाय ने चारा खा लिया, अब पानी माँग रही है!"); }
        }

        function waterCows() {
            let done = false;
            cows.forEach(c => {
                if (c.need === 'water' && coins >= 5) {
                    coins -= 5;
                    c.need = 'none';
                    done = true;
                    setTimeout(() => { c.ready = true; renderCows(); }, 15000);
                }
            });
            if (done) { updateCoins(); renderCows(); showToast("पानी दे दिया! दूध तैयार हो रहा है..."); }
        }

        function collectMilk(id) {
            const c = cows.find(x => x.id === id);
            if (c && c.ready) {
                coins += 90;
                c.ready = false;
                c.need = 'food';
                updateCoins();
                renderCows();
                showToast("🥛 दूध मिल गया! +₹90");
            }
        }

        // Movements
        setInterval(() => {
            hens.forEach(h => {
                const el = document.getElementById(`hen-wrap-${h.id}`);
                if (el) {
                    el.style.left = Math.floor(Math.random() * 200 + 30) + "px";
                    el.style.top = Math.floor(Math.random() * 140 + 50) + "px";
                }
            });
            cows.forEach(c => {
                const el = document.getElementById(`cow-wrap-${c.id}`);
                if (el) {
                    el.style.left = Math.floor(Math.random() * 170 + 30) + "px";
                    el.style.top = Math.floor(Math.random() * 120 + 50) + "px";
                }
            });
        }, 3000);

        renderHens();
        renderCows();
    </script>
</body>
</html>
