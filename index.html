<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Realistic 2D Farm Tycoon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #1a2e10; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        /* Top Bar Header */
        .top-bar {
            width: 100%; max-width: 500px; background: #0f1d0a; border-bottom: 3px solid #fbc02d;
            padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .coins { font-size: 20px; font-weight: bold; color: #fbc02d; }

        /* Main Container */
        .container { width: 100%; max-width: 500px; padding: 15px; display: flex; flex-direction: column; gap: 15px; }

        /* Menu Overlay */
        .menu-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0d1a0a;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; z-index: 200;
        }
        .menu-title { font-size: 28px; font-weight: bold; color: #fbc02d; text-shadow: 0 2px 5px #000; }
        .menu-btn {
            width: 80%; max-width: 300px; padding: 15px; font-size: 18px; font-weight: bold;
            background: linear-gradient(180deg, #4caf50, #2e7d32); color: white; border: 2px solid #8bc34a;
            border-radius: 12px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .menu-btn:active { transform: scale(0.98); }

        /* Section Screen */
        .farm-section { display: none; flex-direction: column; gap: 10px; }
        .active-section { display: flex; }

        /* Custom Notification Toast (Screen Inside Alert) */
        #game-toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); border: 2px solid #fbc02d; color: #fff;
            padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: bold;
            pointer-events: none; opacity: 0; transition: opacity 0.3s ease; z-index: 300;
        }

        /* Pen / Yard Area */
        .pen-area {
            width: 100%; height: 260px; background: #2d5a1e; border: 4px solid #4e342e;
            border-radius: 16px; position: relative; overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* Animals */
        .animal-container {
            position: absolute; display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: left 2s ease, top 2s ease;
        }
        .animal-img { width: 90px; height: 90px; object-fit: contain; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.4)); }
        
        /* Thought Bubbles */
        .bubble {
            background: #ffffff; color: #000; padding: 6px 12px; border-radius: 15px;
            font-size: 12px; font-weight: bold; border: 2px solid #000; position: absolute;
            top: -35px; white-space: nowrap; animation: bounce 1s infinite alternate;
        }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }

        /* Navigation Bar */
        .nav-bar { display: flex; gap: 10px; margin-top: 10px; }
        .btn-nav {
            flex: 1; padding: 12px; background: #3e2723; color: #fff; border: 2px solid #8d6e63;
            border-radius: 10px; font-weight: bold; cursor: pointer; text-align: center;
        }

        /* Action Buttons */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .act-btn {
            padding: 12px; background: linear-gradient(180deg, #ffb300, #ff8f00);
            border: none; border-radius: 10px; color: #000; font-weight: bold; cursor: pointer;
        }
        .act-btn:active { transform: translateY(2px); }
    </style>
</head>
<body>

    <!-- Notification Overlay (Replacing github.io alerts) -->
    <div id="game-toast">गेम में आपका स्वागत है!</div>

    <!-- Top UI -->
    <div class="top-bar">
        <div class="coins">💰 ₹<span id="coins-val">100</span></div>
        <div style="font-size: 14px; color: #8bc34a;" id="zone-title">Main Home</div>
    </div>

    <!-- Main Menu Screen -->
    <div class="menu-screen" id="main-menu">
        <div class="menu-title">🌾 REAL FARM MANAGER 🌾</div>
        <button class="menu-btn" onclick="openZone('hen-farm')">🐔 Hen Farm (मुर्गी फार्म)</button>
        <button class="menu-btn" onclick="openZone('cow-farm')">🐄 Cow Farm (गाय फार्म)</button>
        <button class="menu-btn" onclick="openZone('crop-farm')">🚜 Agriculture (खेती)</button>
    </div>

    <div class="container">

        <!-- 1. HEN FARM SECTION -->
        <div class="farm-section" id="hen-farm">
            <div class="pen-area" id="hen-pen">
                <div class="animal-container" id="hen-1" style="top: 80px; left: 100px;" onclick="clickAnimal('hen')">
                    <div class="bubble" id="hen-bubble" style="display: none;">🌾 दाना चाहिए!</div>
                    <!-- High Quality 2D Hen Image -->
                    <img src="https://cdn-icons-png.flaticon.com/512/1864/1864593.png" class="animal-img" alt="Hen">
                </div>
            </div>
            <div class="action-grid">
                <button class="act-btn" onclick="giveFood('hen')">🌾 दाना दें (₹5)</button>
                <button class="act-btn" onclick="giveWater('hen')">💧 पानी दें (₹2)</button>
            </div>
            <div class="nav-bar">
                <button class="btn-nav" onclick="showMenu()">🏠 मुख्य मेन्यू</button>
            </div>
        </div>

        <!-- 2. COW FARM SECTION -->
        <div class="farm-section" id="cow-farm">
            <div class="pen-area" id="cow-pen">
                <div class="animal-container" id="cow-1" style="top: 70px; left: 80px;" onclick="clickAnimal('cow')">
                    <div class="bubble" id="cow-bubble" style="display: none;">🌿 हरा चारा चाहिए!</div>
                    <!-- High Quality 2D Cow Image -->
                    <img src="https://cdn-icons-png.flaticon.com/512/2396/2396837.png" class="animal-img" style="width: 120px; height: 120px;" alt="Cow">
                </div>
            </div>
            <div class="action-grid">
                <button class="act-btn" onclick="giveFood('cow')">🌿 हरा चारा दें (₹10)</button>
                <button class="act-btn" onclick="giveWater('cow')">💧 पानी दें (₹5)</button>
            </div>
            <div class="nav-bar">
                <button class="btn-nav" onclick="showMenu()">🏠 मुख्य मेन्यू</button>
            </div>
        </div>

        <!-- 3. CROP FARM SECTION -->
        <div class="farm-section" id="crop-farm">
            <div class="pen-area" style="background: #5d4037; display: flex; justify-content: center; align-items: center;">
                <div id="crop-plot" style="text-align: center; cursor: pointer;" onclick="harvestCrop()">
                    <div class="bubble" id="crop-bubble" style="display: none; position: relative; top: -10px;">🌱 पानी दो!</div>
                    <img id="crop-img" src="https://cdn-icons-png.flaticon.com/512/616/616634.png" style="width: 100px; height: 100px;" alt="Crop">
                </div>
            </div>
            <div class="action-grid">
                <button class="act-btn" onclick="plantSeed()">🌱 गेहूँ बोएँ (₹20)</button>
                <button class="act-btn" onclick="waterCrop()">💧 खेत सींचें (₹5)</button>
            </div>
            <div class="nav-bar">
                <button class="btn-nav" onclick="showMenu()">🏠 मुख्य मेन्यू</button>
            </div>
        </div>

    </div>

    <script>
        let coins = 100;

        // Hen States
        let henState = { need: 'food', timer: null, ready: false }; // need: 'food', 'water', 'none'
        // Cow States
        let cowState = { need: 'food', timer: null, ready: false };
        // Crop States
        let cropState = { status: 'empty', watered: false };

        // Custom In-Screen Toast Notification
        function showToast(text) {
            const toast = document.getElementById("game-toast");
            toast.textContent = text;
            toast.style.opacity = "1";
            setTimeout(() => { toast.style.opacity = "0"; }, 2500);
        }

        function updateCoins() {
            document.getElementById("coins-val").textContent = coins;
        }

        // Navigation
        function showMenu() {
            document.getElementById("main-menu").style.display = "flex";
            document.querySelectorAll(".farm-section").forEach(sec => sec.classList.remove("active-section"));
            document.getElementById("zone-title").textContent = "Main Home";
        }

        function openZone(zoneId) {
            document.getElementById("main-menu").style.display = "none";
            document.querySelectorAll(".farm-section").forEach(sec => sec.classList.remove("active-section"));
            document.getElementById(zoneId).classList.add("active-section");

            if(zoneId === 'hen-farm') document.getElementById("zone-title").textContent = "Hen Farm";
            if(zoneId === 'cow-farm') document.getElementById("zone-title").textContent = "Cow Farm";
            if(zoneId === 'crop-farm') document.getElementById("zone-title").textContent = "Agriculture";
        }

        // --- AUTOMATIC NEEDS & SYSTEM ---
        
        // Hen Logic
        function updateHenUI() {
            const bubble = document.getElementById("hen-bubble");
            if (henState.ready) {
                bubble.style.display = "block";
                bubble.style.background = "#fff3cd";
                bubble.textContent = "🥚 Egg Ready! (क्लिक करो)";
            } else if (henState.need === 'food') {
                bubble.style.display = "block";
                bubble.style.background = "#ffffff";
                bubble.textContent = "🌾 दाना चाहिए!";
            } else if (henState.need === 'water') {
                bubble.style.display = "block";
                bubble.style.background = "#e3f2fd";
                bubble.textContent = "💧 पानी चाहिए!";
            } else {
                bubble.style.display = "none";
            }
        }

        function giveFood(type) {
            if (type === 'hen') {
                if (henState.need === 'food') {
                    if (coins >= 5) {
                        coins -= 5;
                        henState.need = 'water';
                        showToast("मुर्गी ने दाना खा लिया! अब पानी माँग रही है।");
                        updateCoins();
                        updateHenUI();
                    } else showToast("पैसे कम हैं!");
                } else showToast("अभी दाना नहीं चाहिए!");
            } else if (type === 'cow') {
                if (cowState.need === 'food') {
                    if (coins >= 10) {
                        coins -= 10;
                        cowState.need = 'water';
                        showToast("गाय ने चारा खा लिया! अब पानी माँग रही है।");
                        updateCoins();
                        updateCowUI();
                    } else showToast("पैसे कम हैं!");
                } else showToast("अभी चारा नहीं चाहिए!");
            }
        }

        function giveWater(type) {
            if (type === 'hen') {
                if (henState.need === 'water') {
                    if (coins >= 2) {
                        coins -= 2;
                        henState.need = 'none';
                        showToast("मुर्गी का पेट भर गया! 15 सेकंड में अंडा देगी...");
                        updateCoins();
                        updateHenUI();

                        // Timer for Egg
                        setTimeout(() => {
                            henState.ready = true;
                            updateHenUI();
                        }, 15000); // Demo timer 15 sec (इसे 120000 करके 2 मिनट कर सकते हैं)
                    } else showToast("पैसे कम हैं!");
                } else showToast("अभी पानी नहीं चाहिए!");
            } else if (type === 'cow') {
                if (cowState.need === 'water') {
                    if (coins >= 5) {
                        coins -= 5;
                        cowState.need = 'none';
                        showToast("गाय ने पानी पी लिया! 20 सेकंड में दूध तैयार होगा...");
                        updateCoins();
                        updateCowUI();

                        setTimeout(() => {
                            cowState.ready = true;
                            updateCowUI();
                        }, 20000);
                    } else showToast("पैसे कम हैं!");
                } else showToast("अभी पानी नहीं चाहिए!");
            }
        }

        function clickAnimal(type) {
            if (type === 'hen') {
                if (henState.ready) {
                    coins += 40;
                    henState.ready = false;
                    henState.need = 'food'; // फिर से दाना माँगेगी
                    showToast("🥚 अंडा मिल गया! ₹40 खाते में जुड़े।");
                    updateCoins();
                    updateHenUI();
                }
            } else if (type === 'cow') {
                if (cowState.ready) {
                    coins += 90;
                    cowState.ready = false;
                    cowState.need = 'food';
                    showToast("🥛 दूध मिल गया! ₹90 खाते में जुड़े।");
                    updateCoins();
                    updateCowUI();
                }
            }
        }

        // Cow UI Update
        function updateCowUI() {
            const bubble = document.getElementById("cow-bubble");
            if (cowState.ready) {
                bubble.style.display = "block";
                bubble.style.background = "#fff3cd";
                bubble.textContent = "🥛 Milk Ready! (क्लिक करो)";
            } else if (cowState.need === 'food') {
                bubble.style.display = "block";
                bubble.style.background = "#ffffff";
                bubble.textContent = "🌿 हरा चारा चाहिए!";
            } else if (cowState.need === 'water') {
                bubble.style.display = "block";
                bubble.style.background = "#e3f2fd";
                bubble.textContent = "💧 पानी चाहिए!";
            } else {
                bubble.style.display = "none";
            }
        }

        // Crop System
        function plantSeed() {
            if(cropState.status === 'empty') {
                if(coins >= 20) {
                    coins -= 20;
                    cropState.status = 'planted';
                    document.getElementById("crop-bubble").style.display = "block";
                    document.getElementById("crop-bubble").textContent = "💧 पानी दो!";
                    showToast("बीज बो दिया गया है! अब पानी दें।");
                    updateCoins();
                } else showToast("पैसे कम हैं!");
            } else showToast("फसल पहले से बोई गई है!");
        }

        function waterCrop() {
            if(cropState.status === 'planted' && !cropState.watered) {
                if(coins >= 5) {
                    coins -= 5;
                    cropState.watered = true;
                    showToast("पानी दे दिया! फसल पक रही है...");
                    updateCoins();

                    setTimeout(() => {
                        cropState.status = 'ready';
                        document.getElementById("crop-bubble").textContent = "🌾 काटें (Harvest)!";
                    }, 10000);
                }
            }
        }

        function harvestCrop() {
            if(cropState.status === 'ready') {
                coins += 100;
                cropState.status = 'empty';
                cropState.watered = false;
                document.getElementById("crop-bubble").style.display = "none";
                showToast("🌾 फसल कट गई! ₹100 मिले।");
                updateCoins();
            }
        }

        // Animal Random Movement
        setInterval(() => {
            const hen = document.getElementById("hen-1");
            const cow = document.getElementById("cow-1");
            hen.style.left = Math.floor(Math.random() * 200 + 20) + "px";
            hen.style.top = Math.floor(Math.random() * 120 + 40) + "px";

            cow.style.left = Math.floor(Math.random() * 180 + 20) + "px";
            cow.style.top = Math.floor(Math.random() * 100 + 40) + "px";
        }, 4000);

        updateHenUI();
        updateCowUI();
    </script>
</body>
</html>
