<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Master Farm Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        /* UI Overlay */
        .top-bar {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 30, 15, 0.85); border: 2px solid #ffd700;
            padding: 12px 20px; border-radius: 12px; color: #ffd700; font-size: 20px; font-weight: bold;
            z-index: 10; backdrop-filter: blur(5px);
        }

        /* Menu Overlay */
        .menu-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 20, 10, 0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 20px; z-index: 20;
        }
        .menu-title { font-size: 32px; color: #ffcc00; text-shadow: 0 0 10px #ff9900; margin-bottom: 10px; }
        .menu-btn {
            width: 250px; padding: 15px; font-size: 18px; font-weight: bold;
            background: linear-gradient(180deg, #4CAF50, #2E7D32); color: #fff;
            border: 2px solid #a3e635; border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.2s;
        }
        .menu-btn:active { transform: scale(0.95); }

        /* Action Controls Panel */
        .control-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; background: rgba(0, 0, 0, 0.7);
            padding: 12px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
        }
        .act-btn {
            background: linear-gradient(180deg, #ffcc00, #ff9900); color: #000;
            border: none; padding: 12px 18px; font-weight: bold; font-size: 14px;
            border-radius: 10px; cursor: pointer; box-shadow: 0 4px 0 #b37700;
        }
        .act-btn:active { transform: translateY(2px); box-shadow: none; }
        .back-btn { position: absolute; top: 80px; left: 15px; z-index: 10; background: #ff3333; color: white; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="top-bar">
        <div>💰 Coins: ₹<span id="coins">200</span></div>
        <div style="font-size: 15px; color: #a3e635;" id="location-name">🏡 Main Farm View</div>
    </div>

    <button class="act-btn back-btn" id="btn-home" onclick="openMenu()" style="display:none;">🔙 Main Menu</button>

    <div class="menu-overlay" id="main-menu">
        <div class="menu-title">🚜 3D FARM SIMULATOR</div>
        <button class="menu-btn" onclick="enterZone('chicken')">🐔 Chicken Farm</button>
        <button class="menu-btn" onclick="enterZone('cow')">🐄 Cow Farm (Dairy)</button>
        <button class="menu-btn" onclick="enterZone('crop')">🌾 Crop Agriculture</button>
    </div>

    <div class="control-panel" id="action-panel" style="display:none;">
        <button class="act-btn" id="btn-1" onclick="handleAction(1)">Feed Grain</button>
        <button class="act-btn" id="btn-2" onclick="handleAction(2)">Give Water</button>
        <button class="act-btn" id="btn-3" onclick="handleAction(3)">Collect / Harvest</button>
    </div>

    <script>
        // --- THREE.JS 3D ENGINE SETUP ---
        let scene, camera, renderer;
        let chickens = [], cows = [], crops = [];
        let currentZone = 'home';
        let coins = 200;

        // Need/Status Indicators
        let chickenHungry = true, cowHungry = true, cropWatered = false;

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            // Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue
            scene.fog = new THREE.Fog(0x87ceeb, 20, 80);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 25);
            camera.lookAt(0, 0, 0);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(20, 40, 20);
            scene.add(sunLight);

            // Ground / Grass Plane
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x3b7a20 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            create3DWorldObjects();
            animate();
        }

        // --- CREATING 3D GRAPHICS PROCEDURALLY ---
        function create3DWorldObjects() {
            // Create 3D Chickens
            for(let i=0; i<4; i++) {
                let chickenGroup = new THREE.Group();
                // Body
                let body = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8), new THREE.MeshLambertMaterial({color: 0xffffff}));
                body.position.y = 0.8;
                chickenGroup.add(body);
                // Beak
                let beak = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.4, 4), new THREE.MeshLambertMaterial({color: 0xff9900}));
                beak.rotation.z = -Math.PI / 2;
                beak.position.set(0.8, 0.9, 0);
                chickenGroup.add(beak);

                chickenGroup.position.set((Math.random()-0.5)*15, 0, (Math.random()-0.5)*15);
                chickens.push(chickenGroup);
                scene.add(chickenGroup);
            }

            // Create 3D Cows
            for(let i=0; i<2; i++) {
                let cowGroup = new THREE.Group();
                // Body
                let body = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.8, 1.4), new THREE.MeshLambertMaterial({color: 0xeeeeee}));
                body.position.y = 1.5;
                cowGroup.add(body);
                // Head
                let head = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({color: 0x333333}));
                head.position.set(1.5, 2, 0);
                cowGroup.add(head);

                cowGroup.position.set((Math.random()-0.5)*20, 0, (Math.random()-0.5)*20);
                cows.push(cowGroup);
                scene.add(cowGroup);
            }
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Move Chickens Automatically in 3D
            chickens.forEach((c, idx) => {
                c.position.x += Math.sin(Date.now() * 0.001 + idx) * 0.03;
                c.position.z += Math.cos(Date.now() * 0.001 + idx) * 0.03;
            });

            // Move Cows Slowly
            cows.forEach((cw, idx) => {
                cw.position.x += Math.cos(Date.now() * 0.0005 + idx) * 0.01;
            });

            renderer.render(scene, camera);
        }

        // --- GAME LOGIC & MENU NAVIGATION ---
        function openMenu() {
            document.getElementById('main-menu').style.display = 'flex';
            document.getElementById('action-panel').style.display = 'none';
            document.getElementById('btn-home').style.display = 'none';
            document.getElementById('location-name').textContent = "🏡 Main Farm View";
            camera.position.set(0, 25, 35);
            camera.lookAt(0, 0, 0);
        }

        function enterZone(zone) {
            currentZone = zone;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('action-panel').style.display = 'flex';
            document.getElementById('btn-home').style.display = 'block';

            const b1 = document.getElementById('btn-1');
            const b2 = document.getElementById('btn-2');
            const b3 = document.getElementById('btn-3');

            if(zone === 'chicken') {
                document.getElementById('location-name').textContent = "🐔 Chicken Coop Yard";
                camera.position.set(0, 8, 12);
                b1.textContent = "🌾 Give Grain (दाना)";
                b2.textContent = "💧 Give Water";
                b3.textContent = "🥚 Collect Eggs";
            } else if(zone === 'cow') {
                document.getElementById('location-name').textContent = "🐄 Cow Dairy Barn";
                camera.position.set(0, 10, 18);
                b1.textContent = "🌿 Feed Hay (चारा)";
                b2.textContent = "💧 Give Water";
                b3.textContent = "🥛 Milk Cow";
            } else if(zone === 'crop') {
                document.getElementById('location-name').textContent = "🌾 Crop Agriculture Field";
                camera.position.set(0, 12, 15);
                b1.textContent = "🌱 Plant Seeds (₹20)";
                b2.textContent = "💧 Water Field";
                b3.textContent = "✂️ Harvest & Sell";
            }
        }

        function handleAction(actNum) {
            if(currentZone === 'chicken') {
                if(actNum === 1 || actNum === 2) {
                    alert("मुर्गियों को दाना/पानी दे दिया गया है! वे अब 3D में अंडे देने के लिए तैयार हैं।");
                    chickenHungry = false;
                } else {
                    if(!chickenHungry) {
                        coins += 50;
                        alert("ताज़े अंडे मिले! ₹50 खाते में जुड़ गए।");
                        chickenHungry = true;
                    } else {
                        alert("मुर्गी भूखी है! पहले दाना और पानी दें।");
                    }
                }
            } else if(currentZone === 'cow') {
                if(actNum === 1 || actNum === 2) {
                    alert("गाय को हरा चारा और पानी खिला दिया गया है।");
                    cowHungry = false;
                } else {
                    if(!cowHungry) {
                        coins += 120;
                        alert("बाल्टी भरकर दूध निकाला गया! ₹120 कमा लिए।");
                        cowHungry = true;
                    } else {
                        alert("गाय चारा मांग रही है! पहले चारा और पानी दें।");
                    }
                }
            } else if(currentZone === 'crop') {
                if(actNum === 1) {
                    if(coins >= 20) { coins -= 20; alert("बीज बो दिए गए हैं!"); }
                } else if(actNum === 2) {
                    cropWatered = true;
                    alert("खेत में पानी दे दिया गया है! फसल तैयार हो रही है।");
                } else {
                    if(cropWatered) {
                        coins += 150;
                        alert("फसल काटकर बाज़ार में बेची गई! ₹150 मिले।");
                        cropWatered = false;
                    } else {
                        alert("फसल अभी सूखी है! पहले पानी दें।");
                    }
                }
            }
            document.getElementById('coins').textContent = coins;
        }

        window.onload = () => {
            init3D();
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
